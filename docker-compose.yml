version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MODEL_NAME=microsoft/DialoGPT-medium
      - VLLM_ENABLED=true
      - VLLM_TENSOR_PARALLEL_SIZE=1
      - VLLM_GPU_MEMORY_UTILIZATION=0.9
      - HF_TOKEN=${HF_TOKEN}
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
    volumes:
      - ./backend:/app
      - model_cache:/root/.cache/huggingface
    restart: unless-stopped
    networks:
      - microcontroller-api-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_VERSION=0.1.0
      - REACT_APP_NAME=Microcontroller API Assistant
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - microcontroller-api-network

  # Optional: Training service for model fine-tuning
  training:
    build:
      context: ./training
      dockerfile: Dockerfile
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - HF_USERNAME=${HF_USERNAME}
      - WANDB_API_KEY=${WANDB_API_KEY}
      - WANDB_PROJECT=microcontroller-api-assistant
    volumes:
      - ./training:/app
      - ./training/data:/app/data
      - ./training/models:/app/models
      - model_cache:/root/.cache/huggingface
    networks:
      - microcontroller-api-network
    profiles:
      - training
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - microcontroller-api-network
    profiles:
      - production

volumes:
  model_cache:
    driver: local

networks:
  microcontroller-api-network:
    driver: bridge
